[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-images"
version = "0.1.1"
description = "Independent image generation and editing MCP delegated to local Codex"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["psutil>=6; sys_platform == 'win32'", "pywin32>=308; sys_platform == 'win32'", "aiohttp>=3.9,<4", "mcp>=1.26,<2", "Pillow>=10"]

[project.scripts]
aster-images = "aster_images.server:main"

[tool.setuptools.packages.find]
include = ["aster_images*"]

[tool.setuptools.package-data]
aster_images = ["assets/skills/*/*"]
