[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-squad"
version = "0.4.27"
description = "Resident agent squads, permissions and collaboration on the public Aster SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pywin32>=308; sys_platform == 'win32'", "psutil>=6; sys_platform == 'win32'", "aster-harness[mcp,code-mode,chatgpt]>=0.1.28,<0.2", "aster-relay>=0.5.2,<0.6", "aiohttp>=3.9", "mcp>=1.10,<2", "uvicorn>=0.30", "toml>=0.10", "webauthn>=2.8,<3"]

[project.urls]
Repository = "https://github.com/WayneW1119/AsterSquad"
Issues = "https://github.com/WayneW1119/AsterSquad/issues"

[project.optional-dependencies]
dev = ["playwright>=1.50,<2", "build>=1,<2"]
windows-window = ["pywebview>=6.2,<7; sys_platform == 'win32'"]

[project.scripts]
aster-squad = "squad.server:main"
aster-console = "squad.fleet:main"

[tool.setuptools.packages.find]
include = ["squad*"]

[tool.setuptools.package-data]
squad = ["assets/suite-skills/*/*.md", "assets/suite-skills/*/references/*", "assets/*.md", "assets/*.py", "assets/*.ico", "assets/skills/*/*", "assets/skills/*/references/*", "web/*"]
